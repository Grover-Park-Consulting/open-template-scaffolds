<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="480" fill="#f3f3f3"/>

  <!-- Window 1: library folder -->
  <g>
    <rect x="20" y="20" width="420" height="440" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
    <rect x="20" y="20" width="420" height="34" rx="6" fill="#e8e8e8" stroke="#c9c9c9"/>
    <circle cx="38" cy="37" r="6" fill="#d9d9d9"/>
    <circle cx="58" cy="37" r="6" fill="#d9d9d9"/>
    <circle cx="78" cy="37" r="6" fill="#d9d9d9"/>
    <text x="230" y="42" font-size="13" fill="#555" text-anchor="middle">File Explorer</text>

    <text x="34" y="76" font-size="13" fill="#333">This PC  &gt;  OS (C:)  &gt;  OpenTemplateScaffolds</text>
    <line x1="20" y1="86" x2="440" y2="86" stroke="#e0e0e0"/>

    <g font-size="14" fill="#222">
      <text x="40" y="118">📁 templates</text>
      <text x="40" y="150">📁 standards</text>
      <text x="40" y="182">📁 prompts</text>
      <text x="40" y="214">📁 build-records</text>
      <text x="40" y="246">📄 README.md</text>
      <text x="40" y="278">📄 GETTING-STARTED.md</text>
    </g>

    <rect x="34" y="330" width="392" height="108" rx="4" fill="#f7f7f7" stroke="#dcdcdc"/>
    <text x="50" y="354" font-size="12" fill="#444" font-weight="bold">1 — your library folder</text>
    <text x="50" y="376" font-size="12" fill="#555">Just text files. No Trusted Location needed.</text>
    <text x="50" y="396" font-size="12" fill="#555">Everything the template needs lives here.</text>
    <text x="50" y="416" font-size="12" fill="#555">Path: C:\OpenTemplateScaffolds</text>
  </g>

  <!-- Window 2: trusted database folder -->
  <g>
    <rect x="460" y="20" width="420" height="440" rx="6" fill="#ffffff" stroke="#c9c9c9"/>
    <rect x="460" y="20" width="420" height="34" rx="6" fill="#e8e8e8" stroke="#c9c9c9"/>
    <circle cx="478" cy="37" r="6" fill="#d9d9d9"/>
    <circle cx="498" cy="37" r="6" fill="#d9d9d9"/>
    <circle cx="518" cy="37" r="6" fill="#d9d9d9"/>
    <text x="670" y="42" font-size="13" fill="#555" text-anchor="middle">File Explorer</text>

    <text x="474" y="76" font-size="13" fill="#333">This PC  &gt;  OS (C:)  &gt;  Databases  &gt;  NorthwindDev2_5</text>
    <line x1="460" y1="86" x2="880" y2="86" stroke="#e0e0e0"/>

    <g font-size="14" fill="#222">
      <text x="480" y="118">📄 NorthwindDev2_5.accdb</text>
    </g>

    <rect x="474" y="330" width="392" height="108" rx="4" fill="#f7f7f7" stroke="#dcdcdc"/>
    <text x="490" y="354" font-size="12" fill="#444" font-weight="bold">2 — your trusted database folder</text>
    <text x="490" y="376" font-size="12" fill="#555">A separate folder, added as a Trusted Location</text>
    <text x="490" y="396" font-size="12" fill="#555">in Access, so the VBA the template writes can run.</text>
    <text x="490" y="416" font-size="12" fill="#555">Path: C:\Databases\NorthwindDev2_5</text>
  </g>
</svg>
