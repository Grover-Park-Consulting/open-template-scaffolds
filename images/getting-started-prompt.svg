  <rect x="40" y="96" width="820" height="320" rx="4" fill="#252526" stroke="#3c3c3c"/>
  <text x="56" y="122" font-size="12" fill="#6a9955">-- pasted from prompts/StocktakeScan-OutcomeFirst-StartHere.md --</text>

  <g font-size="13" fill="#d4d4d4">
    <text x="56" y="150">Build scan-driven stocktake counting into my Access database using the</text>
    <text x="56" y="172">outcome-first method.</text>

    <text x="56" y="204">Outcome: every scan is recorded and nothing scanned is silently dropped,</text>
    <text x="56" y="226">duplicate scans of the same item are recognized and not double-counted, a</text>
    <text x="56" y="248">barcode that matches nothing known is held for review rather than guessed</text>
    <text x="56" y="270">at or discarded, and any product whose count strays outside its tolerance —</text>
    <text x="56" y="292">including one nobody scanned at all — is flagged for review.</text>

    <text x="56" y="324">Resources — these files are inside the Open Template Scaffolds library</text>
    <text x="56" y="346">folder; the paths below are relative to that folder's root:</text>
    <text x="56" y="368">templates/stocktakescan/stocktake-scan-outcome-first.md (the template), ...</text>
  </g>

  <rect x="56" y="392" width="8" height="16" fill="#d4d4d4"/>

  <text x="820" y="450" font-size="12" fill="#888" text-anchor="end">not yet sent</text>
